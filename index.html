<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7E9">
<title>Yami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF7E9;
    --beige: #F0EED9;
    --forest: #6C4AA0;   /* purple primary */
    --mid: #E8A63B;       /* amber, mid-score badge */
    --yellow: #F5C242;    /* golden-yellow accent — used outside onboarding (camera, badges) */
    --yellow-soft: #FCE9AE;
    --purple-light: #B48EE0;  /* onboarding accent: progress bar, selected states, focus */
    --purple-soft: #EDE0F7;
    --ink: #2A2140;       /* dark plum */
    --gray: #79738A;
    --track: #E4E6D3;
    --btn-gray: #ECEBD8;
    --green: #6FA92B;
    --red: #EE7B3E;
    --radius-card: 20px;
    --shadow: 0 8px 24px rgba(93, 61, 140, .15);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); }
  body {
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  input { font: inherit; color: inherit; }

  #app {
    max-width: 430px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; position: relative; background: var(--cream);
  }
  @media (min-width: 520px) {
    body { background: #EBE3F2; }
    #app { min-height: min(860px, 100dvh); margin-top: max(0px, calc((100dvh - 860px) / 2)); border-radius: 36px; box-shadow: 0 20px 60px rgba(93,61,140,.22); overflow: hidden; }
  }
  span[lang] { unicode-bidi: isolate; }
  .rom { font-size: .6em; font-weight: 700; opacity: .6; letter-spacing: 0; }
  :lang(fa), :lang(ar) { font-family: "Vazirmatn", "Nunito", system-ui, sans-serif; }

  .screen { flex: 1; display: flex; flex-direction: column; padding: 0 24px; animation: fade .28s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .screen.spiral-out { animation: spiralOut .55s cubic-bezier(.5,0,.75,0) both; }
  @keyframes spiralOut { to { transform: scale(.2) rotate(420deg); opacity: 0; } }

  .topbar { padding: 18px 0 0; display: flex; flex-direction: column; gap: 16px; }
  .progress { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--purple-light); border-radius: 99px; transition: width .35s ease; }
  .back { width: 40px; height: 40px; border-radius: 50%; background: var(--btn-gray); display: grid; place-items: center; }
  .back svg { width: 18px; height: 18px; }

  h1, h2, .why { font-family: "Fraunces", "Iowan Old Style", Georgia, serif; }
  h1 { font-size: 32px; line-height: 1.15; font-weight: 700; letter-spacing: -.015em; margin: 0; }
  h2 { font-size: 22px; font-weight: 800; margin: 0; }
  .sub { color: var(--gray); font-size: 17px; line-height: 1.45; font-weight: 600; margin: 10px 0 0; }
  .body { flex: 1; display: flex; flex-direction: column; padding-top: 28px; }
  .center { align-items: center; justify-content: center; text-align: center; }

  .footer { padding: 16px 0 calc(24px + env(safe-area-inset-bottom)); margin-top: auto; }
  .btn {
    width: 100%; padding: 18px 24px; border-radius: 999px; background: var(--forest); color: #fff;
    font-weight: 800; font-size: 18px; letter-spacing: .01em; transition: transform .12s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .28; cursor: not-allowed; }

  .opts { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    width: 100%; padding: 20px 24px; border-radius: 999px; background: var(--beige);
    font-weight: 700; font-size: 18px; text-align: start; border: 2px solid transparent;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .opt:active { transform: scale(.985); }
  .opt.sel { background: var(--purple-soft); border-color: var(--purple-light); }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip-opt { padding: 14px 22px; border-radius: 999px; background: var(--beige); font-weight: 700; font-size: 17px; border: 2px solid transparent; transition: background .15s, border-color .15s; }
  .chip-opt.sel { background: var(--purple-soft); border-color: var(--purple-light); }

  .field { width: 100%; padding: 20px 24px; border-radius: 999px; background: var(--beige); border: 2px solid transparent; font-size: 20px; font-weight: 700; outline: none; }
  .field:focus { border-color: var(--purple-light); background: #F5EEFB; }
  .field::placeholder { color: #A5AA96; font-weight: 600; }
  .row { display: flex; gap: 12px; }
  .lbl { font-size: 14px; font-weight: 800; color: var(--gray); margin: 0 0 8px; margin-inline-start: 18px; letter-spacing: .02em; }
  .lang-feedback { color: var(--forest); font-weight: 700; margin-top: 14px; }

  /* Yami the leaf sprite */
  .mascot { display: block; }
  .mascot.float { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  .mascot.pulse { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.09); } }
  .mascot.greet { animation: greetIn .7s cubic-bezier(.2,1.4,.4,1) both, bob 3.2s ease-in-out 0.7s infinite; }
  @keyframes greetIn { from { transform: scale(.4) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }

  /* Welcome */
  .welcome-title { margin-top: 26px; }
  .welcome-sub { margin-top: 10px; }
  .welcome-hero { padding: 20px 0; }
  .onboard-mascot { display: flex; justify-content: flex-end; margin-top: -6px; }

  /* Home */
  .home-head { padding: 28px 0 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--btn-gray); display: grid; place-items: center; position: relative; flex: none; }
  .iconbtn svg { width: 20px; height: 20px; }
  .cart-badge {
    position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px;
    background: var(--red); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; border: 2px solid var(--cream);
  }
  .hero { display: flex; justify-content: center; padding: 34px 0 30px; }
  .snap-btn {
    width: 100%; padding: 34px 20px; border-radius: 32px; background: var(--forest); color: #fff;
    display: flex; flex-direction: column; align-items: center; gap: 12px; font-size: 24px; font-weight: 900;
    box-shadow: var(--shadow); transition: transform .12s;
  }
  .snap-btn:active { transform: scale(.98); }
  .snap-btn .cam { width: 64px; height: 64px; border-radius: 50%; background: var(--yellow); display: grid; place-items: center; }
  .snap-btn .cam svg { width: 32px; height: 32px; }
  .empty { color: var(--gray); font-weight: 600; font-size: 17px; text-align: center; padding: 28px 12px; background: var(--beige); border-radius: var(--radius-card); margin-top: 14px; }
  .log { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; padding-bottom: 32px; }
  .mini { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: var(--radius-card); padding: 10px; box-shadow: var(--shadow); }
  .mini .ph { width: 78px; height: 78px; border-radius: 14px; background-size: cover; background-position: center; position: relative; flex: none; }
  .mini .t { font-weight: 800; font-size: 17px; line-height: 1.3; }
  .mini .m { color: var(--gray); font-size: 14px; font-weight: 600; margin-top: 3px; }

  .badge {
    position: absolute; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 900; font-size: 15px; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.2);
    top: -8px; inset-inline-end: -8px;
  }
  .badge.big { width: 68px; height: 68px; font-size: 27px; border-width: 4px; top: 14px; inset-inline-end: 14px; }
  .g { background: var(--green); } .y { background: var(--mid); color: #3a2f08; } .r { background: var(--red); }

  /* Snap */
  .viewfinder {
    flex: 1; min-height: 340px; margin-top: 22px; border-radius: 28px; background: #2A1F42; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; position: relative; overflow: hidden;
  }
  .viewfinder::before {
    content: ""; position: absolute; inset: 26px; border-radius: 18px; pointer-events: none;
    background:
      linear-gradient(var(--yellow), var(--yellow)) top left / 34px 4px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) top left / 4px 34px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) top right / 34px 4px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) top right / 4px 34px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) bottom left / 34px 4px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) bottom left / 4px 34px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) bottom right / 34px 4px no-repeat,
      linear-gradient(var(--yellow), var(--yellow)) bottom right / 4px 34px no-repeat;
  }
  .viewfinder p { margin: 0; font-weight: 700; font-size: 18px; text-align: center; padding: 0 44px; color: #eee; }
  .samples { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
  .sample { width: 52px; height: 52px; border-radius: 16px; background: #3E2E5C; font-size: 26px; }
  .small { font-size: 14px; color: #b7c4a8; font-weight: 700; }
  .hidden-input { display: none; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* Confirm */
  .thumb { width: 100%; height: 190px; border-radius: var(--radius-card); background-size: cover; background-position: center; box-shadow: var(--shadow); margin-top: 22px; }
  .items { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  .item {
    display: inline-flex; align-items: center; gap: 8px; background: var(--yellow-soft); border: 2px solid var(--yellow);
    border-radius: 999px; padding: 10px 18px; padding-inline-end: 10px; font-weight: 800; font-size: 17px;
  }
  .item .edit { width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.7); display: grid; place-items: center; }
  .item .edit svg { width: 14px; height: 14px; }
  .item input { border: 0; background: transparent; outline: none; font-weight: 800; font-size: 17px; width: 130px; padding: 0; }
  .item.add { background: transparent; border-style: dashed; padding: 10px 18px; color: var(--gray); }

  /* Result */
  .photo-card { position: relative; margin-top: 22px; }
  .photo-card .thumb { margin-top: 0; height: 210px; }
  .verdict { margin-top: 16px; font-weight: 800; font-size: 15px; color: var(--gray); letter-spacing: .03em; text-transform: uppercase; }
  .say { display: flex; gap: 10px; align-items: flex-end; margin-top: 12px; }
  .say .mascot { flex: none; margin-bottom: -4px; }
  .bubble {
    position: relative; background: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow);
    border-end-start-radius: 6px;
  }
  .why { font-size: 20px; line-height: 1.45; font-weight: 600; margin: 0; }
  .swap { margin-top: 18px; background: var(--beige); border-radius: var(--radius-card); padding: 18px 20px; display: flex; gap: 14px; }
  .swap .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--yellow-soft); display: grid; place-items: center; font-size: 20px; flex: none; }
  .swap b { display: block; font-size: 14px; color: var(--gray); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 4px; }
  .swap span { font-weight: 700; font-size: 17px; line-height: 1.45; }
  .swap-add {
    margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 11px 18px; border-radius: 999px;
    background: var(--forest); color: #fff; font-weight: 800; font-size: 14px; white-space: nowrap; transition: transform .12s, opacity .2s;
  }
  .swap-add svg { width: 16px; height: 16px; flex: none; }
  .swap-add:active { transform: scale(.97); }
  .swap-add.added { background: var(--yellow-soft); color: var(--forest); }
  .swap-add:disabled { opacity: 1; cursor: default; }

  /* Grocery list */
  .grocery-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .grocery-item { display: flex; align-items: flex-start; gap: 12px; background: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .gi-body { flex: 1; display: flex; flex-direction: column; gap: 2px; padding-top: 2px; }
  .gi-title { font-weight: 700; font-size: 16px; line-height: 1.3; }
  .gi-sub { font-size: 12px; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: .02em; }
  .gi-meta { font-size: 13px; font-weight: 700; color: var(--gray); }
  .gi-meta a { color: var(--forest); text-decoration: underline; }
  .grocery-item.checked .gi-title, .grocery-item.checked .gi-sub { text-decoration: line-through; color: var(--gray); }
  .grocery-item .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--purple-light); display: grid; place-items: center; flex: none; background: transparent; margin-top: 2px; }
  .grocery-item.checked .check { background: var(--purple-light); }
  .grocery-item .check svg { width: 14px; height: 14px; }
  .grocery-item .remove { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--gray); flex: none; }
  .grocery-item .remove svg { width: 13px; height: 13px; }

  .instacart-btn {
    width: 100%; margin-top: 20px; padding: 15px 20px; border-radius: 999px; background: #0AAD0A; color: #fff;
    font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .12s, opacity .2s;
  }
  .instacart-btn svg { width: 18px; height: 18px; flex: none; }
  .instacart-btn:active { transform: scale(.98); }
  .instacart-btn.connected { background: var(--purple-soft); color: var(--forest); }
  .instacart-btn:disabled { opacity: 1; cursor: default; }

  .order-summary { display: flex; justify-content: space-between; align-items: baseline; padding: 0 6px 14px; font-weight: 700; color: var(--gray); }
  .order-summary b { font-size: 24px; color: var(--ink); font-family: "Fraunces", serif; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   Yami stays in English, but sprinkles in words from the language the person
   grew up with — the way a mom code-switches. Each phrase is [text, romanization?].
   NOTE: phrases are demo copy — have a native speaker review before showing anyone.
   ===================================================================== */
const SPRINKLES = {
  en: { label: "Just English", native: "English" },
  es: { native: "Español", label: "Spanish",
    greet: ["¡Hola"], endear: ["mi vida"], praise: ["¡Muy bien"], keep: ["¡Vas bien"], okay: ["No pasa nada"], eat: ["¡Buen provecho"] },
  fa: { native: "فارسی", label: "Persian",
    greet: ["سلام", "salaam"], endear: ["عزیزم", "azizam"], praise: ["آفرین", "afarin"], keep: ["خوبه", "khoobe"], okay: ["اشکالی نداره", "eshkali nadare"], eat: ["نوش جان", "nooshe jaan"] },
  ar: { native: "العربية", label: "Arabic",
    greet: ["مرحبا", "marhaba"], endear: ["يا قلبي", "ya albi"], praise: ["ما شاء الله", "mashallah"], keep: ["يلا", "yalla"], okay: ["معلش", "ma'alesh"], eat: ["بالهنا والشفا", "bil hana wal shifa"] },
  hi: { native: "हिन्दी", label: "Hindi",
    greet: ["नमस्ते", "namaste"], endear: ["बेटा", "beta"], praise: ["शाबाश", "shabash"], keep: ["चलो", "chalo"], okay: ["कोई बात नहीं", "koi baat nahi"], eat: ["स्वाद लेकर खाना", "swaad lekar khana"] },
  zh: { native: "中文", label: "Mandarin",
    greet: ["你好", "nǐ hǎo"], endear: ["宝贝", "bǎobèi"], praise: ["真棒", "zhēn bàng"], keep: ["加油", "jiāyóu"], okay: ["没关系", "méi guānxi"], eat: ["慢慢吃", "màn màn chī"] },
  ko: { native: "한국어", label: "Korean",
    greet: ["안녕", "annyeong"], endear: ["아가", "aga"], praise: ["잘했어", "jal haesseo"], keep: ["화이팅", "hwaiting"], okay: ["괜찮아", "gwaenchanha"], eat: ["맛있게 먹어", "masitge meogeo"] },
  fr: { native: "Français", label: "French",
    greet: ["Salut"], endear: ["mon chou"], praise: ["Bravo"], keep: ["Courage"], okay: ["Ce n'est pas grave"], eat: ["Bon appétit"] }
};

/* Render one sprinkled phrase: native text, plus a small romanization for non-Latin scripts. */
function ph(kind) {
  const sp = SPRINKLES[state.lang];
  if (!sp || !sp[kind]) return "";
  const [text, roman] = sp[kind];
  const t = roman ? text : text.charAt(0).toUpperCase() + text.slice(1);
  const rom = roman ? ` <span class="rom">(${esc(roman)})</span>` : "";
  return `<span lang="${state.lang}">${esc(t)}</span>${rom}`;
}
const sprinkling = () => state.lang !== "en";

/* The person can type ANY language — this just recognizes common names/spellings
   (English or native) for the handful we have mom-phrases written for, so typing
   "farsi", "Persian" or "فارسی" all land on the same curated set. Anything else
   still goes through — we just don't have phrases for it yet in this prototype. */
const LANG_ALIASES = {
  english: "en",
  spanish: "es", "español": "es", espanol: "es", castellano: "es",
  persian: "fa", farsi: "fa", "فارسی": "fa", "فارسی زبان": "fa",
  arabic: "ar", "العربية": "ar", "عربي": "ar",
  hindi: "hi", "हिन्दी": "hi",
  mandarin: "zh", chinese: "zh", "中文": "zh", "普通话": "zh", putonghua: "zh",
  korean: "ko", "한국어": "ko", hangugeo: "ko",
  french: "fr", "français": "fr", francais: "fr"
};
const COMMON_LANGS = [
  "English", "Español (Spanish)", "فارسی (Persian)", "العربية (Arabic)", "हिन्दी (Hindi)",
  "中文 (Mandarin)", "한국어 (Korean)", "Français (French)", "Português (Portuguese)",
  "Tiếng Việt (Vietnamese)", "Tagalog", "Русский (Russian)", "Deutsch (German)",
  "Italiano (Italian)", "日本語 (Japanese)", "اردو (Urdu)", "বাংলা (Bengali)",
  "Türkçe (Turkish)", "Kiswahili (Swahili)", "ਪੰਜਾਬੀ (Punjabi)", "ไทย (Thai)",
  "Polski (Polish)", "Українська (Ukrainian)", "עברית (Hebrew)", "Ελληνικά (Greek)"
];
function matchLang(text) {
  const t = text.trim().toLowerCase().replace(/\s*\(.*\)\s*/g, "");
  if (!t) return null;
  if (LANG_ALIASES[t]) return LANG_ALIASES[t];
  for (const [alias, key] of Object.entries(LANG_ALIASES)) if (t === alias.toLowerCase()) return key;
  return null;
}

/* ---------- Mock analysis library  ---------- */
const ANALYSES = {
  eggs: {
    keys: ["egg", "omelet", "toast", "breakfast"],
    score: 84,
    en: { items: ["Egg whites", "Toast", "Blueberries"],
      why: "Solid protein here! You're a bit low on fiber though — a piece of fruit would round this out nicely.",
      swap: "Swap the white toast for whole-grain, or add a small handful of berries or half an apple on the side.",
      swapItem: "Whole-grain bread" },
  },
  smoothie: {
    keys: ["smoothie", "shake", "juice", "acai"],
    score: 67,
    en: { items: ["Banana", "Strawberries", "Almond milk", "Honey"],
      why: "Ooh, fruity and refreshing! It's mostly quick sugar though, so you might be hungry again in an hour.",
      swap: "Blend in a scoop of Greek yogurt or a spoonful of peanut butter — that little bit of protein keeps you full for longer.",
      swapItem: "Greek yogurt" },
  },
  pasta: {
    keys: ["pasta", "spaghetti", "noodle", "lasagna", "penne"],
    score: 46,
    en: { items: ["Spaghetti", "Marinara sauce", "Parmesan"],
      why: "A cozy bowl of comfort, and that's totally okay! It's mostly carbs today, with not much protein or greens alongside.",
      swap: "Toss in some grilled chicken or white beans, and add a side of sautéed spinach or a little green salad.",
      swapItem: "Canned white beans" },
  },
  salad: {
    keys: ["salad", "greens", "bowl", "lettuce", "veggie"],
    score: 91,
    en: { items: ["Mixed greens", "Grilled chicken", "Cherry tomatoes", "Avocado"],
      why: "Look at all that color! Great fiber, healthy fats, and plenty of protein to keep your energy steady.",
      swap: "You're doing great — add a handful of chickpeas or quinoa if you want something a little more filling.",
      swapItem: "Chickpeas or quinoa" },
  },
  unknown: {
    keys: [],
    score: 72,
    en: { items: ["Chicken", "Rice", "Steamed veggies"],
      why: "Nice, that looks like a real, balanced plate! A little more color from veggies would make it even better.",
      swap: "Add a big spoonful of a second veggie, like roasted broccoli or carrots, to fill out half the plate.",
      swapItem: "Broccoli or carrots" },
  }
};
const RANDOM_POOL = Object.keys(ANALYSES);

function matchAnalysis(text) {
  const t = (text || "").toLowerCase();
  for (const [k, a] of Object.entries(ANALYSES)) if (a.keys.some(w => t.includes(w))) return k;
  return null;
}

/* ---------- State ---------- */
const state = {
  screen: "welcome", lang: "en", langChosen: false, justLogged: false,
  profile: { name: "", birthday: "", height: "", weight: "", gender: "", goal: "", goalCustom: "", diet: [],
    groceryFreq: "", shopsOnline: "", store: "", storeCustom: "", budget: "" },

/* Rough estimated total of everything currently in the list — only items we have a
   mock price for count toward it, since custom-typed items won't have one. */
function cartTotal() {
  let sum = 0, priced = 0;
  state.groceryList.forEach(it => {
    if (!it.price) return;
    const n = parseFloat(it.price.replace(/[^0-9.]/g, ""));
    if (!isNaN(n)) { sum += n; priced++; }
  });
  return { sum, priced, count: state.groceryList.length };
}
function orderDestination() {
  if (state.instacartConnected) return INSTACART_URL;
  const { store, storeCustom } = state.profile;
  if (store && STORE_HOME[store]) return STORE_HOME[store];
  if (storeCustom.trim()) return `https://www.google.com/search?q=${encodeURIComponent(storeCustom + " grocery delivery")}`;
  return INSTACART_URL;
}

/* Mock brand recommendations, keyed by the generic grocery item (lowercase).
   NOTE: this is demo data for the prototype, not a live product/price feed — in the
   real product these would come from an actual retailer API. "Cottage cheese" carries
   the one real, verified product link (given to us directly); everything else links to
   a live search on the person's chosen store rather than a guessed product page. */
const PRODUCT_RECS = {
  "cottage cheese": { brand: "Good Culture", product: "2% Low-Fat Classic Cottage Cheese", price: "$4.99",
    url: "https://www.target.com/p/good-culture-2-low-fat-classic-cottage-cheese-16oz/-/A-52007667", storeOverride: "Target" },
  "greek yogurt": { brand: "Chobani", product: "Non-Fat Plain Greek Yogurt", price: "$5.49" },
  "oat milk": { brand: "Califia Farms", product: "Oat Milk", price: "$4.29" },
  "chickpeas": { brand: "365 by Whole Foods Market", product: "Organic Garbanzo Beans", price: "$1.49" },
  "chickpeas or quinoa": { brand: "365 by Whole Foods Market", product: "Organic Garbanzo Beans", price: "$1.49" },
  "canned white beans": { brand: "365 by Whole Foods Market", product: "Organic Cannellini Beans", price: "$1.29" },
  "whole-grain bread": { brand: "Dave's Killer Bread", product: "21 Whole Grains and Seeds", price: "$5.99" },
  "mixed berries": { brand: "Wyman's", product: "Frozen Wild Blueberries", price: "$4.49" },
  "broccoli or carrots": { brand: "365 by Whole Foods Market", product: "Organic Broccoli Florets", price: "$3.49" },
  "dark chocolate (the good kind)": { brand: "Hu", product: "Simple Dark Chocolate Bar", price: "$4.99" },
  "overnight oats": { brand: "Quaker", product: "Old Fashioned Oats", price: "$3.99" },
  "eggs": { brand: "Vital Farms", product: "Pasture-Raised Eggs", price: "$6.49" },
  "coconut yogurt": { brand: "Cocojune", product: "Organic Coconut Yogurt", price: "$6.99" }
};

/* Turn a plain grocery-list line into a full item — with a specific brand/product/price
   recommendation and a link to find it, when we have one for that item and the person
   told us where they shop. */
function buildGroceryItem(text) {
  const key = text.trim().toLowerCase();
  const rec = PRODUCT_RECS[key];
  const item = { id: "g" + Date.now() + Math.random().toString(36).slice(2, 6), text: text.trim(), checked: false };
  if (rec) {
    item.brand = rec.brand; item.product = rec.product; item.price = rec.price;
    const storeKey = state.profile.store;
    if (rec.url) { item.url = rec.url; item.storeLabel = rec.storeOverride || STORES[storeKey] || "Target"; }
    else if (storeKey && STORE_SEARCH[storeKey]) { item.url = STORE_SEARCH[storeKey](`${rec.brand} ${rec.product}`); item.storeLabel = STORES[storeKey]; }
    else if (state.profile.storeCustom) { item.storeLabel = state.profile.storeCustom; }
  }
  return item;
}

/* A little starter list Yami puts together the moment you enter — like a mom
   who's already thought ahead — based on what you told her in onboarding. */
function seedGroceryList() {
  if (state.groceryList.length) return;
  const { diet, goal } = state.profile;
  const starters = [];
  if (diet.includes("vegan")) starters.push("Oat milk", "Chickpeas");
  else if (diet.includes("df")) starters.push("Oat milk", "Coconut yogurt");
  else starters.push("Cottage cheese", "Eggs");
  if (goal === "energy") starters.push("Overnight oats");
  else if (goal === "cycle") starters.push("Dark chocolate (the good kind)");
  else starters.push("Mixed berries");
  starters.forEach(text => state.groceryList.push(buildGroceryItem(text)));
}
function addGroceryItem(text) {
  const v = text.trim();
  state.groceryEditing = false;
  if (v) state.groceryList.push(buildGroceryItem(v));
  render();
}

function shrink(dataUrl, max = 640) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = img.width * r; c.height = img.height * r;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
function sampleImage(emoji, bg) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440"><rect width="600" height="440" fill="${bg}"/><circle cx="300" cy="220" r="170" fill="#fff" opacity=".55"/><text x="300" y="285" font-size="190" text-anchor="middle">${emoji}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

        ${state.items.map((it, i) => state.editing === i
          ? `<span class="item"><input id="edit-in" value="${esc(it)}" maxlength="30"></span>`
          : `<span class="item">${esc(it)}<button class="edit" data-a="edit" data-i="${i}" aria-label="Edit ${esc(it)}">${ICON.pencil}</button></span>`).join("")}
        <button class="item add" data-a="add">+ Add something</button>
      </div>
    </div>
    <div class="footer"><button class="btn" data-a="confirm" ${state.items.length ? "" : "disabled"}>Looks right</button></div>
  </section>`,

  result: () => {
    const A = ANALYSES[state.analysisKey], a = A.en;
    // Half in their language, half in English: a short phrase that matches the score, then the English feedback.
    const kind = A.score >= 80 ? "praise" : A.score >= 50 ? "keep" : "okay";
    const lead = sprinkling() ? `${ph(kind)}, ${ph("endear")}${kind === "okay" ? "." : "!"} ` : "";
    const already = state.groceryList.some(x => x.text.toLowerCase() === a.swapItem.toLowerCase());
    return `<section class="screen">
    ${topbar("confirm")}
    <div class="body" style="padding-top:0">
      <div class="photo-card"><div class="thumb" style="background-image:url('${state.photo}')"></div>
        <span class="badge big ${tone(A.score)}">${A.score}</span></div>
      <div class="verdict">${verdictOf(A.score)}</div>
      <div class="say">${mascot(58)}<div class="bubble"><p class="why">${lead}${esc(a.why)}</p></div></div>
      <div class="swap"><div class="ic">🌱</div><div>
        <b>Try this</b><span>${a.swap}</span><br>
        <button class="swap-add ${already ? "added" : ""}" data-a="grocery-add-swap" data-item="${esc(a.swapItem)}" ${already ? "disabled" : ""}>
          ${already ? `${ICON.check.replace('stroke="#fff"', 'stroke="#6C4AA0"')} Added to your list` : `${ICON.cart} Add to grocery list`}
        </button>
      </div></div>
    </div>
    <div class="footer"><button class="btn" data-a="log">Log it</button></div>
  </section>`;
  },

  grocery: () => {
    const items = state.groceryList;
    const { sum, priced, count } = cartTotal();
    return `<section class="screen">
    ${topbar("home")}
    <div class="body" style="padding-top:20px">
      <h1>Your grocery list</h1>
      <p class="sub">${sprinkling() ? ph("endear") + ", i" : "I"}'ve started it off with a few things that'll make next week a little easier. 🛒</p>
      ${items.length ? `<div class="grocery-list">${items.map(it => {
        const title = it.brand ? `${it.brand} ${it.product}` : it.text;
        const metaBits = [];
        if (it.price) metaBits.push(it.price);
        if (it.url) metaBits.push(`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.storeLabel || "Find it")}</a>`);
        else if (it.storeLabel) metaBits.push(esc(it.storeLabel));
        return `<div class="grocery-item ${it.checked ? "checked" : ""}">
          <button class="check" data-a="grocery-toggle" data-id="${it.id}" aria-label="Toggle ${esc(it.text)}">${it.checked ? ICON.check : ""}</button>
          <div class="gi-body">
            <span class="gi-title">${esc(title)}</span>
            ${it.brand ? `<span class="gi-sub">for ${esc(it.text)}</span>` : ""}
            ${metaBits.length ? `<span class="gi-meta">${metaBits.join(" · ")}</span>` : ""}
          </div>
          <button class="remove" data-a="grocery-remove" data-id="${it.id}" aria-label="Remove ${esc(it.text)}">${ICON.close}</button>
        </div>`;
      }).join("")}</div>`
        : `<div class="empty">Your list is empty — swaps you add from a result will land here.</div>`}
      <div class="items" style="margin-top:18px">
        ${state.groceryEditing
          ? `<span class="item"><input id="grocery-in" placeholder="Add an item" maxlength="40"></span>`
          : `<button class="item add" data-a="grocery-add-start">+ Add an item</button>`}
      </div>
      <button class="instacart-btn ${state.instacartConnected ? "connected" : ""}" data-a="instacart-connect" ${state.instacartConnected ? "disabled" : ""}>
        ${state.instacartConnected ? `${ICON.check.replace('stroke="#fff"', 'stroke="#6C4AA0"')} Connected to Instacart` : `${ICON.cartWhite} Connect to Instacart`}
      </button>
    </div>
    ${items.length ? `<div class="footer">
      <div class="order-summary">
        <span>Estimated total${priced < count ? " <span class='rom'>(priced items)</span>" : ""}</span>
        <b>$${sum.toFixed(2)}</b>
      </div>
      <button class="btn" data-a="order-now">Order Now</button>
    </div>` : `<div style="height:28px"></div>`}
  </section>`;
  }
};

/* ---------- Render + validation ---------- */
function render() {
  $app.innerHTML = SCREENS[state.screen]();
  const p = state.profile;
  const bind = (id, fn) => { const el = document.getElementById(id); if (el) { el.addEventListener("input", fn); fn(); } return el; };
  const setNext = ok => { const b = document.getElementById("next"); if (b) b.disabled = !ok; };

  switch (state.screen) {
    case "q-name": { const el = bind("in-name", () => { p.name = document.getElementById("in-name").value.trim(); setNext(!!p.name); }); if (el && !p.name) el.focus(); break; }
    case "q-lang": {
      const el = document.getElementById("in-lang");
      if (el) {
        el.addEventListener("input", () => {
          const v = el.value, t = v.trim();
          const key = matchLang(t);
          const sigBefore = `${state.lang}|${state.customLabel}`;
          state.customLangInput = v;
          state.lang = key || (t ? "en" : state.lang);
          state.customLabel = (!key && t) ? t : null;
          state.langChosen = !!t;
          setNext(state.langChosen);
          // Only a full re-render (for the feedback line + chip highlight) when the
          // resolved language actually changes — not on every keystroke — so typing stays smooth.
          if (`${state.lang}|${state.customLabel}` !== sigBefore) {
            const pos = el.selectionStart;
            render();
            const el2 = document.getElementById("in-lang");
            el2.focus(); el2.setSelectionRange(pos, pos);
          }
        });
        if (!state.customLangInput) el.focus();
      }
      setNext(state.langChosen);
      break;
    }
    case "q-birthday": bind("in-bday", () => { p.birthday = document.getElementById("in-bday").value; setNext(!!p.birthday); }); break;
    case "q-body": {
      const chk = () => { p.height = document.getElementById("in-h").value; p.weight = document.getElementById("in-w").value; setNext(+p.height > 0 && +p.weight > 0); };
      bind("in-h", chk); bind("in-w", chk); break;
    }
    case "q-gender": setNext(!!p.gender); break;
    case "q-goal": {
      const el = document.getElementById("in-goal-custom");
      if (el) el.addEventListener("input", () => {
        p.goalCustom = el.value;
        if (el.value.trim()) p.goal = ""; // typing your own answer overrides a tapped option
        setNext(!!p.goal || !!p.goalCustom.trim());
      });
      setNext(!!p.goal || !!p.goalCustom.trim());
      break;
    }
    case "q-diet": setNext(p.diet.length > 0); break;
    case "q-grocery": {
      const chk = () => {
        p.budget = document.getElementById("in-budget").value;
        p.storeCustom = document.getElementById("in-store-custom").value;
        if (p.storeCustom.trim()) p.store = ""; // typing your own store overrides a tapped one
        setNext(!!p.groceryFreq && !!p.shopsOnline && (!!p.store || !!p.storeCustom.trim()) && +p.budget > 0);
      };
      bind("in-budget", chk);
      bind("in-store-custom", chk);
      break;
    }
    case "grocery": {
      if (state.groceryEditing) {
        const el = document.getElementById("grocery-in");
        el.focus();
        el.addEventListener("blur", () => addGroceryItem(el.value));
        el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
      }
      break;
    }
  }
  if (state.screen === "confirm" && state.editing >= 0) {
    const el = document.getElementById("edit-in");
    el.focus(); el.select();
    el.addEventListener("blur", () => finishEdit(el.value));
    el.addEventListener("keydown", e => { if (e.key === "Enter") el.blur(); });
  }
}

function finishEdit(val) {
  const i = state.editing; if (i < 0) return;
  const v = val.trim();
  state.editing = -1;
  if (v) state.items[i] = v; else state.items.splice(i, 1);
  render();
}

/* ---------- Snap flow ---------- */
function analyze(photo, hint) {
  state.photo = photo; state.hint = hint;
  const key = matchAnalysis(hint) || RANDOM_POOL[Math.floor(Math.random() * RANDOM_POOL.length)];
  state.analysisKey = key;
  state.items = [...ANALYSES[key].en.items];
  state.originalItems = [...state.items];
  state.editing = -1;
  go("analyzing");
  setTimeout(() => { if (state.screen === "analyzing") go("confirm"); }, 2000);
}
function readFile(file) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = async () => analyze(await shrink(fr.result), file.name);
  fr.readAsDataURL(file);
}

/* ---------- Events ---------- */
$app.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, p = state.profile;
  switch (a) {
    case "start": {
      const el = $app.querySelector(".screen");
      el.classList.add("spiral-out");
      el.addEventListener("animationend", () => go("q-name"), { once: true });
      break;
    }
    case "go": go(t.dataset.to); break;
    case "next": go(ONBOARD[ONBOARD.indexOf(state.screen) + 1]); break;
    case "lang": {
      const k = t.dataset.v;
      state.lang = k; state.langChosen = true; state.customLabel = null;
      state.customLangInput = k === "en" ? "English" : SPRINKLES[k].native;
      render(); break;
    }
    case "gender": p.gender = t.dataset.v; render(); break;
    case "goal": p.goal = t.dataset.v; p.goalCustom = ""; render(); break;
    case "diet": {
      const v = t.dataset.v;
      if (v === "none") p.diet = p.diet.includes("none") ? [] : ["none"];
      else { p.diet = p.diet.filter(x => x !== "none"); p.diet = p.diet.includes(v) ? p.diet.filter(x => x !== v) : [...p.diet, v]; }
      render(); break;
    }
    case "groceryFreq": p.groceryFreq = t.dataset.v; render(); break;
    case "shopsOnline": p.shopsOnline = t.dataset.v; render(); break;
    case "store": p.store = t.dataset.v; p.storeCustom = ""; render(); break;
    case "enter-app": seedGroceryList(); go("home"); break;
    case "camera": document.getElementById("cam-in").click(); break;
    case "upload": document.getElementById("up-in").click(); break;
    case "sample": { const s = SAMPLES[+t.dataset.i]; analyze(sampleImage(s.emoji, s.bg), s.key); break; }
    case "edit": state.editing = +t.dataset.i; render(); break;
    case "add": state.items.push(""); state.editing = state.items.length - 1; render(); break;
    case "confirm": {
      const edited = state.items.join("|") !== state.originalItems.join("|");
      if (edited) state.analysisKey = matchAnalysis(state.items.join(" ")) || "unknown";
      go("result"); break;
    }
    case "log": {
      state.meals.unshift({ photo: state.photo, items: [...state.items], score: ANALYSES[state.analysisKey].score,
        time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) });
      state.justLogged = true;
      go("home"); break;
    }
    case "grocery-add-swap": {
      const text = t.dataset.item;
      if (!state.groceryList.some(x => x.text.toLowerCase() === text.toLowerCase())) {
        state.groceryList.push(buildGroceryItem(text));
      }
      render(); break;
    }
    case "grocery-add-start": state.groceryEditing = true; render(); break;
    case "grocery-toggle": {
      const it = state.groceryList.find(x => x.id === t.dataset.id);
      if (it) it.checked = !it.checked;
      render(); break;
    }
    case "grocery-remove": state.groceryList = state.groceryList.filter(x => x.id !== t.dataset.id); render(); break;
    case "instacart-connect": state.instacartConnected = true; render(); break;
    case "order-now": window.open(orderDestination(), "_blank", "noopener"); break;
  }
});
$app.addEventListener("change", e => {
  if (e.target.id === "cam-in" || e.target.id === "up-in") readFile(e.target.files[0]);
});

render();
</script>
</body>
</html>
